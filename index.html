     <!-- 2. THE BACKGROUND CANVAS WITH THE 4 STATE HOVER TINTS -->
    <div id="parallax-bg-canvas" class="dot-matrix-bg">
        <div class="bg-tint tint-comics"></div>
        <div class="bg-tint tint-commissions"></div>
        <div class="bg-tint tint-wiki"></div>
        <div class="bg-tint tint-about"></div>
    </div>

    <!-- 3. THE DUAL-ACTION HAPTIC & COLOR CONTROLLER SCRIPT -->
    <script>
        if (window.innerWidth >= 960) {
            const canvas = document.getElementById('parallax-bg-canvas');
            
            // Explicitly selecting cards by their unique classes
            const cardComics = document.querySelector('.card-comics');
            const cardCommissions = document.querySelector('.card-commissions');
            const cardWiki = document.querySelector('.card-wiki');
            const cardAbout = document.querySelector('.card-about');

            // ─── PART 1: THE HAPTIC SWAY MOUSE TRACKER ───
            window.addEventListener('mousemove', (e) => {
                const x = (e.clientX - window.innerWidth / 2) / (window.innerWidth / 2);
                const y = (e.clientY - window.innerHeight / 2) / (window.innerHeight / 2);

                canvas.style.setProperty('--mouse-x', x);
                canvas.style.setProperty('--mouse-y', y);
            });

            // ─── PART 2: THE BULLETPROOF HOVER COLOR DETECTOR ───
            if(cardComics) {
                cardComics.addEventListener('mouseenter', () => canvas.classList.add('show-comics'));
                cardComics.addEventListener('mouseleave', () => canvas.classList.remove('show-comics'));
            }
            if(cardCommissions) {
                cardCommissions.addEventListener('mouseenter', () => canvas.classList.add('show-commissions'));
                cardCommissions.addEventListener('mouseleave', () => canvas.classList.remove('show-commissions'));
            }
            if(cardWiki) {
                cardWiki.addEventListener('mouseenter', () => canvas.classList.add('show-wiki'));
                cardWiki.addEventListener('mouseleave', () => canvas.classList.remove('show-wiki'));
            }
            if(cardAbout) {
                cardAbout.addEventListener('mouseenter', () => canvas.classList.add('show-about'));
                cardAbout.addEventListener('mouseleave', () => canvas.classList.remove('show-about'));
            }
          }
          // 1. HANDLE TOUCHSCREEN TAP DELAYS
  document.querySelectorAll('.delayed-link').forEach(card => {
    card.addEventListener('click', function(event) {
      const isTouch = window.matchMedia("(pointer: coarse)").matches;
      
      if (isTouch) {
        event.preventDefault(); 
        const targetUrl = this.getAttribute('href');
        
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 800); 
      }
    });
  });

  // 2. THE ABSOLUTE REFRESH SOLUTION FOR MOBILE HISTORY CACHES
  window.addEventListener('pageshow', function(event) {
    // If event.persisted is true, or performance navigation type indicates a back-forward layout shift
    const historyTraversal = event.persisted || 
                             (typeof window.performance != "undefined" && 
                              window.performance.navigation.type === 2);
                              
    if (historyTraversal) {
      // Instantly refresh the template context to completely destroy sticky touchscreen states
      window.location.reload();
    }
  });
    </script>

    </body>
