<!doctype html>
<html lang="en">
  <html>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Gloober_frk | Artist Hub</title>
      <!-- Connecting to your single shared CSS file -->
      <link rel="stylesheet" href="/style.css" />
    </head>

    <body class="page-wiki" id="sub-page">
      <!--Main Header Wrapper (The logo at the top of the pages ot the top left)-->
      <header id="main-header">
        <div class="container">
          <div class="nav-spacer"></div>

          <!--To replace SVG, place a <img> tag where "Gloober" is.-->
          <a href="/" class="site-logo">
            <img
              src="/Images/logoverse.webp"
              alt="Gloober Comics Logo"
              class="logo-img"
            />
          </a>

          <!-- Standard Top Navigation Bar for Subpages -->
          <nav id="global-nav">
            <ul>
              <li><a href="/">Home</a></li>
              <li><a href="/comics/">Comics</a></li>
              <li><a href="/commisions/">Commissions</a></li>
              <li><a href="/wiki/" class="active-page">GloobVerse</a></li>
              <li><a href="/about/">About</a></li>
            </ul>
          </nav>

          <button
            id="menu-trigger"
            class="menu-button"
            aria-label="Toggle Navigation"
          >
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
          </button>
        </div>
      </header>

      <main></main>

      <footer id="social-hub">
        <div class="social-links-wrapper">
          <a
            href="https://www.instagram.com/gloober_frk/"
            class="social-link"
            target="_blank"
            rel="noopener"
            >Instagram</a
          >
          <a
            href="https://www.webtoons.com/p/community/en/u/gloober"
            class="social-link"
            target="_blank"
            rel="noopener"
            >Webtoon</a
          >
          <a
            href="https://artfight.net/~gloober_frk"
            class="social-link"
            target="_blank"
            rel="noopener"
            >Artfight</a
          >
          <a
            href="https://toyhou.se/gloober_frk"
            class="social-link"
            target="_blank"
            rel="noopener"
            >Toyhouse</a
          >
        </div>
      </footer>

      <!-- 2. THE BACKGROUND CANVAS -->
      <div id="parallax-bg-canvas" class="dot-matrix-bg"></div>

      <script>
        const menuTrigger = document.getElementById("menu-trigger");
        const globalNav = document.getElementById("global-nav");

        // 1. Open / Close panel on click
        menuTrigger.addEventListener("click", (e) => {
          e.stopPropagation(); // Prevents immediate close click event bubbling
          menuTrigger.classList.toggle("open");
          globalNav.classList.toggle("open");
        });

        // 2. Close when user clicks anywhere outside the nav or button area
        document.addEventListener("click", (e) => {
          if (
            !globalNav.contains(e.target) &&
            !menuTrigger.contains(e.target)
          ) {
            menuTrigger.classList.remove("open");
            globalNav.classList.remove("open");
          }
        });

        // 3. Close immediately when user starts scrolling the main page window
        window.addEventListener(
          "scroll",
          () => {
            menuTrigger.classList.remove("open");
            globalNav.classList.remove("open");
          },
          { passive: true },
        ); // Enhances mobile scrolling processing performance
      </script>
    </body>
  </html>
</html>
